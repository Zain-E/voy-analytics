# Copy to streamlit/.streamlit/secrets.toml and edit. Never commit the real file —
# .gitignore excludes every secrets.toml at any depth.
#
# On Streamlit Community Cloud there is no file: paste the same contents into
# Settings → Secrets in the app's dashboard.

gcp_project    = "zains-gcp"
marts_dataset  = "voy_analytics"   # dataset dbt writes the marts to
source_dataset = "voy"             # raw dataset (all-time subscription count only)
snapshot_date  = "2024-08-16"      # must match snapshot_date in dbt_project.yml

# ---------------------------------------------------------------- credentials --
# Local development: omit the block below and use Application Default Credentials —
#   gcloud auth application-default login
# as a principal holding bigquery.dataViewer on the datasets above and
# bigquery.jobUser on the project.
#
# Hosted (Community Cloud): there is no gcloud, so supply a service-account key here.
# The service account CI already uses works — the dashboard only ever reads. Paste the
# fields from its JSON key, keeping the private key's \n escapes intact.
#
# [gcp_service_account]
# type                        = "service_account"
# project_id                  = "zains-gcp"
# private_key_id              = "..."
# private_key                 = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
# client_email                = "voy-dashboard@zains-gcp.iam.gserviceaccount.com"
# client_id                   = "..."
# auth_uri                    = "https://accounts.google.com/o/oauth2/auth"
# token_uri                   = "https://oauth2.googleapis.com/token"
# auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
# client_x509_cert_url        = "..."
