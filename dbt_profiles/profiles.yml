# dbt connection profile for this project.
# Location: this repo's dbt_profiles/ folder. run_dbt.sh points dbt here via
# `--profiles-dir dbt_profiles`; CI sets DBT_PROFILES_DIR to it.
#
# No secrets are hard-coded — project/keyfile come from env vars (with sensible
# defaults), so this file is safe to commit. Local dev needs nothing set.

voy_retention:
  target: dev
  outputs:

    # ---- Local development ----
    #   gcloud auth application-default login
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('PROJECT_ID', 'zains-gcp') }}"
      dataset: voy_analytics
      location: US
      threads: 4
      priority: interactive

    # ---- Production: service account ----
    prod:
      type: bigquery
      method: service-account-json
      project: "{{ env_var('PROJECT_ID', 'zains-gcp') }}"
      dataset: voy_analytics
      location: US
      threads: 4
      priority: interactive
      keyfile_json:
        type: service_account
        project_id: "{{ env_var('PROJECT_ID') }}"
        private_key_id: "{{ env_var('PRIVATE_KEY_ID') }}"
        private_key: "{{ env_var('PRIVATE_KEY') }}"
        client_email: "{{ env_var('CLIENT_EMAIL') }}"
        client_id: "{{ env_var('CLIENT_ID') }}"
        auth_uri: "{{ env_var('AUTH_URI', 'https://accounts.google.com/o/oauth2/auth') }}"
        token_uri: "{{ env_var('TOKEN_URI', 'https://oauth2.googleapis.com/token') }}"
        auth_provider_x509_cert_url: "{{ env_var('AUTH_PROVIDER_X509_CERT_URL', 'https://www.googleapis.com/oauth2/v1/certs') }}"
        client_x509_cert_url: "{{ env_var('CLIENT_X509_CERT_URL', '') }}"
