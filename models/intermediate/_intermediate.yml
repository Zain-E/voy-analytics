version: 2

models:
  - name: int_customer_continuous_subscriptions
    description: >
      Core model. Each customer's subscription spells merged into continuous
      subscription periods (gaps-and-islands). One row per customer × continuous period.
      Gaps between periods are churn/reactivation events. Validated: reproduces
      raw MAU exactly and contains no overlapping periods per customer.
    columns:
      - name: customer_id
        description: Customer key.
        tests: [not_null]
      - name: period_index
        description: 1-based index of the continuous period within the customer.
        tests: [not_null]
      - name: subscription_period_start
        description: First day of the continuous subscription period (inclusive).
        tests: [not_null]
      - name: subscription_period_end
        description: Last day of the continuous subscription period (inclusive).
        tests: [not_null]
      - name: is_first_subscription_period
        description: True for the customer's first continuous period (drives survival).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [customer_id, period_index]

  - name: int_subscription_active_periods
    description: >
      Subscription-grain companion to int_customer_continuous_subscriptions: each
      subscription's spells merged into continuous active periods (gaps-and-islands),
      one row per subscription × period. Exists because dim_subscription can only carry
      min(start) → max(end), a span that covers the gaps between spells — anything asking
      "was this subscription live on day D" needs these periods instead. Uses the same
      island_gap_tolerance_days as the customer-grain merge.
    columns:
      - name: subscription_id
        description: Subscription key.
        tests: [not_null]
      - name: customer_id
        description: Owning customer (constant across the subscription's periods).
        tests: [not_null]
      - name: period_index
        description: 1-based index of the active period within the subscription.
        tests: [not_null]
      - name: active_period_start
        description: First day of the continuous active period (inclusive).
        tests: [not_null]
      - name: active_period_end
        description: Last day of the continuous active period (inclusive).
        tests: [not_null]
      - name: spell_count
        description: Number of raw activity spells merged into this period.
      - name: is_first_active_period
        description: True for the subscription's earliest active period.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [subscription_id, period_index]
