version: 2

models:
  - name: dim_customer
    description: >
      Conformed customer dimension — one row per REGISTERED customer (includes
      never-active customers for conversion tracking). Carries acquisition
      attribution and first/last-activity summary derived from the merged
      continuous subscription periods.
    columns:
      - name: customer_id
        description: Primary key — unique per registered customer.
        tests: [not_null, unique]
      - name: country
        description: Customer's country (Brazil or United Kingdom in current data).
        tests: [not_null]
      - name: acq_taxonomy
        description: Acquisition group (e.g. Hair Loss, ED, Weight Loss); 'Unknown' where unattributed.
        tests: [not_null]
      - name: first_activation_date
        description: Date of the customer's first-ever subscription spell (null if never active).
      - name: cohort_month
        description: Month of first activation — the customer's acquisition cohort (null if never active).
      - name: last_active_date
        description: Last day covered by any of the customer's subscription periods (null if never active).
      - name: first_period_end
        description: >
          Last day of the customer's FIRST continuous subscription period — i.e. their
          first churn point. Drives never-churned (survival) retention (null if never active).
      - name: is_ever_active
        description: True if the customer ever held a subscription spell.
        tests: [not_null]

  - name: dim_subscription
    description: >
      Conformed subscription dimension — one row per subscription. The
      subscription-grain companion to dim_customer: a subscription belongs to one
      customer and may appear as several spells in the raw activity table, collapsed
      here to a single summarised row. Downstream subscription-grain models join this
      on subscription_id to resolve the owning customer's country / acquisition group.
      (Spell-level interval maths still read stg_voy__activity directly.)
    columns:
      - name: subscription_id
        description: Primary key — unique per subscription.
        tests: [not_null, unique]
      - name: customer_id
        description: Owning customer (foreign key to dim_customer).
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: country
        description: Owning customer's country, denormalised from dim_customer for drill-down.
        tests: [not_null]
      - name: acq_taxonomy
        description: Owning customer's acquisition group, denormalised from dim_customer for drill-down.
        tests: [not_null]
      - name: subscription_start_date
        description: Earliest spell start date across the subscription's spells (inclusive).
        tests: [not_null]
      - name: subscription_end_date
        description: Latest spell end date across the subscription's spells (inclusive).
        tests: [not_null]
      - name: lifespan_days
        description: Calendar span from first start to last end, inclusive (end − start + 1 days).
      - name: spell_count
        description: Number of raw activity spells (intervals) that make up the subscription.
      - name: is_first_subscription
        description: True for the customer's earliest-starting subscription (subscription_id breaks ties).
      - name: is_live_at_snapshot
        description: True if the subscription's last spell reaches the snapshot date (still live at extract).

  - name: fct_customer_per_month_snapshot
    description: >
      Analysis-ready fact. One row per ever-subscribed customer per calendar month
      from cohort month to snapshot. has_active_subscription / has_continuous_active_subscription drive all
      retention and churn metrics. subscription count is informational only.
    columns:
      - name: customer_id
        description: Customer key (ever-subscribed customers only).
        tests: [not_null]
      - name: calendar_month
        description: Calendar month the row describes (ranges cohort_month → snapshot month).
        tests: [not_null]
      - name: cohort_month
        description: Month the customer first activated (their acquisition cohort). Constant across the customer's rows.
      - name: months_since_acquisition
        description: Tenure index (0 = acquisition month).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: has_active_subscription
        description: Customer held a live subscription overlapping this month (MAU basis).
        tests: [not_null]
      - name: has_continuous_active_subscription
        description: Still inside the first unbroken subscription period — no churn yet (survival basis).
        tests: [not_null]
      - name: active_subscription_count
        description: Distinct live subscriptions that month. Informational — does not affect active status.
      - name: country
        description: Customer's country, denormalised from dim_customer for drill-down.
      - name: acq_taxonomy
        description: Customer's acquisition group, denormalised from dim_customer for drill-down.
      - name: is_new_customer
        description: First active month for the customer (acquisition).
      - name: has_reactivated_subscription_this_month
        description: Active this month after being inactive last month, with prior history (win-back).
      - name: has_churned_this_month
        description: Inactive this month after being active last month.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [customer_id, calendar_month]

  - name: viz_cohort_retention
    description: >
      Cohort × tenure retention, drillable by dimension. One row per
      cohort_month × country × acq_taxonomy × tenure. Two measures:
      never_churned_retention (customers who have never churned since acquisition)
      and total_retention (customers active now, win-backs included).
    columns:
      - name: cohort_month
        description: Acquisition cohort — the month this cohort's customers first activated.
      - name: country
        description: Country dimension for drill-down.
      - name: acq_taxonomy
        description: Acquisition group dimension for drill-down.
      - name: tenure
        description: Months since acquisition (0 = acquisition month) — the retention curve's x-axis.
      - name: cohort_size
        description: Customers acquired in the cohort — the denominator for both rates.
      - name: retained_never_churned
        description: >
          Count of the cohort still in their FIRST unbroken subscription at this tenure
          (i.e. never churned since they joined).
      - name: retained_total
        description: >
          Count of the cohort ACTIVE at this tenure, including customers who churned and
          later came back (reactivations / win-backs).
      - name: never_churned_retention
        description: >
          retained_never_churned / cohort_size. Share of the cohort that has NEVER churned
          since acquisition — still continuously subscribed. Monotonically decreasing; this
          is the classic "survival" curve and the conservative view of retention.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: total_retention
        description: >
          retained_total / cohort_size. Share of the cohort ACTIVE at this tenure,
          INCLUDING win-backs — that is, never-churned customers PLUS those who churned and
          reactivated. Always ≥ never_churned_retention; the gap between the two is
          reactivation. (Name note: it counts everyone active now, not only the churned-and-returned.)
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [cohort_month, country, acq_taxonomy, tenure]

  - name: viz_active_users_daily
    description: >
      Daily active-user reporting by dimension. One row per day × country × acq_taxonomy.
      daily_active_customers (live on the day) and active_customers_32d (trailing 32 days)
      are customer-grain; live_subscriptions is subscription-grain (informational — does
      not define "active").
    columns:
      - name: day
        description: Calendar day the row describes.
        tests: [not_null]
      - name: country
        description: Country dimension for drill-down.
      - name: acq_taxonomy
        description: Acquisition group dimension for drill-down.
      - name: daily_active_customers
        description: Distinct customers with a live subscription covering the day.
      - name: active_customers_32d
        description: Distinct customers active within the last active_window_days (default 32).
      - name: live_subscriptions
        description: Distinct subscriptions live on the day (subscription grain, informational).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [day, country, acq_taxonomy]
