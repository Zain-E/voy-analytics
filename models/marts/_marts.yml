version: 2

models:
  - name: dim_customer
    description: Conformed customer dimension (all registered customers).
    columns:
      - name: customer_id
        description: Primary key.
        tests: [not_null, unique]
      - name: country
        tests: [not_null]
      - name: acq_taxonomy
        description: Acquisition group; 'Unknown' where unattributed.
        tests: [not_null]
      - name: cohort_month
        description: Month of first activation (null if never active).
      - name: is_ever_active
        description: True if the customer ever had a subscription spell.
        tests: [not_null]

  - name: fct_customer_per_month_snapshot
    description: >
      Analysis-ready fact. One row per ever-active customer per calendar month
      from cohort month to snapshot. has_active_subscription / has_continuous_active_subscription drive all
      retention and churn metrics. subscription count is informational only.
    columns:
      - name: customer_id
        tests: [not_null]
      - name: calendar_month
        description: Calendar month the row describes (ranges cohort_month → snapshot month).
        tests: [not_null]
      - name: months_since_acquisition
        description: Tenure index (0 = acquisition month).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: has_active_subscription
        description: Customer held a live subscription overlapping this month (MAU basis).
        tests: [not_null]
      - name: has_continuous_active_subscription
        description: Still inside the first unbroken subscription period — no churn yet (survival basis).
        tests: [not_null]
      - name: active_subscription_count
        description: Distinct live subscriptions that month. Informational — does not affect active status.
      - name: is_new_customer
        description: First active month for the customer (acquisition).
      - name: has_reactivated_subscription_this_month
        description: Active this month after being inactive last month, with prior history (win-back).
      - name: has_churned_this_month
        description: Inactive this month after being active last month.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [customer_id, calendar_month]

  - name: viz_cohort_retention
    description: >
      Cohort × tenure retention, drillable by dimension. Two measures:
      never_churned_retention (customers who have never churned since acquisition)
      and total_retention (customers active now, win-backs included).
    columns:
      - name: cohort_size
        description: Customers acquired in the cohort — the denominator for both rates.
      - name: retained_never_churned
        description: >
          Count of the cohort still in their FIRST unbroken subscription at this tenure
          (i.e. never churned since they joined).
      - name: retained_total
        description: >
          Count of the cohort ACTIVE at this tenure, including customers who churned and
          later came back (reactivations / win-backs).
      - name: never_churned_retention
        description: >
          retained_never_churned / cohort_size. Share of the cohort that has NEVER churned
          since acquisition — still continuously subscribed. Monotonically decreasing; this
          is the classic "survival" curve and the conservative view of retention.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: total_retention
        description: >
          retained_total / cohort_size. Share of the cohort ACTIVE at this tenure,
          INCLUDING win-backs — that is, never-churned customers PLUS those who churned and
          reactivated. Always ≥ never_churned_retention; the gap between the two is
          reactivation. (Name note: it counts everyone active now, not only the churned-and-returned.)
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [cohort_month, country, acq_taxonomy, tenure]

  - name: viz_active_users_daily
    description: >
      Daily active-user reporting by dimension. daily_active_customers (live on the day)
      and active_customers_32d (trailing 32 days) are customer-grain; live_subscriptions
      is subscription-grain (informational — does not define "active").
    columns:
      - name: day
        tests: [not_null]
      - name: daily_active_customers
        description: Distinct customers with a live subscription covering the day.
      - name: active_customers_32d
        description: Distinct customers active within the last active_window_days (default 32).
      - name: live_subscriptions
        description: Distinct subscriptions live on the day (subscription grain, informational).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [day, country, acq_taxonomy]
